<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="glance: one hidden browser for every agent. Several agent terminals send jobs into one queue that feeds a single browser window.">
  <title>glance</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5d6ff"/>
      <stop offset="0.6" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1280" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)" opacity="0.8"/>

  <!-- wordmark -->
  <g transform="translate(72 118)">
    <path d="M0 34 Q36 4 72 34 Q36 64 0 34 Z" fill="none" stroke="#f0f6fc" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="36" cy="34" r="13" fill="url(#iris)"/>
    <circle cx="36" cy="34" r="5" fill="#0d1117"/>
    <text x="92" y="52" class="sans" font-size="56" font-weight="650" fill="#f0f6fc" letter-spacing="-1">glance</text>
  </g>
  <text x="72" y="222" class="sans" font-size="26" fill="#c9d1d9">One hidden GPU browser for every agent.</text>
  <text x="72" y="258" class="sans" font-size="18" fill="#8b949e">Screenshots, animation frames, frame timing and downloads,</text>
  <text x="72" y="284" class="sans" font-size="18" fill="#8b949e">queued one page at a time. A skill for Claude Code.</text>
  <text x="72" y="336" class="mono" font-size="15" fill="#7ee787">$ <tspan fill="#f0f6fc">glance</tspan><tspan fill="#c9d1d9"> shot app.html --t 2 --out frame.png</tspan></text>

  <!-- agents -->
  <g class="mono" font-size="12">
    <g transform="translate(700 70)">
      <rect width="150" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="22" r="5" fill="#58a6ff"/><text x="30" y="26" fill="#c9d1d9">agent-1  shot</text>
    </g>
    <g transform="translate(700 130)">
      <rect width="150" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="22" r="5" fill="#d2a8ff"/><text x="30" y="26" fill="#c9d1d9">agent-2  shots</text>
    </g>
    <g transform="translate(700 190)">
      <rect width="150" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="22" r="5" fill="#ffa657"/><text x="30" y="26" fill="#c9d1d9">agent-3  download</text>
    </g>
    <g transform="translate(700 250)">
      <rect width="150" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="22" r="5" fill="#7ee787"/><text x="30" y="26" fill="#c9d1d9">agent-4  measure</text>
    </g>
    <g transform="translate(700 310)">
      <rect width="150" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 4"/>
      <text x="16" y="26" fill="#8b949e">agent-n  ...</text>
    </g>
  </g>
  <!-- converging lines into the queue -->
  <g fill="none" stroke="#30363d" stroke-width="2">
    <path d="M850 92 C 900 92, 900 212, 940 212"/>
    <path d="M850 152 C 900 152, 900 212, 940 212"/>
    <path d="M850 212 L 940 212"/>
    <path d="M850 272 C 900 272, 900 212, 940 212"/>
    <path d="M850 332 C 900 332, 900 212, 940 212" stroke-dasharray="4 4"/>
  </g>
  <!-- queue -->
  <g transform="translate(940 196)">
    <rect width="64" height="32" rx="8" fill="#161b22" stroke="#d29922"/>
    <circle cx="16" cy="16" r="5" fill="#7ee787"/>
    <circle cx="32" cy="16" r="5" fill="#ffa657"/>
    <circle cx="48" cy="16" r="5" fill="#d2a8ff"/>
  </g>
  <text x="972" y="250" class="mono" font-size="11" fill="#8b949e" text-anchor="middle">queue</text>
  <path d="M1004 212 L 1040 212" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M1034 206 L 1042 212 L 1034 218" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- the one browser -->
  <g transform="translate(1048 132)">
    <rect width="180" height="160" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <line x1="0" y1="28" x2="180" y2="28" stroke="#30363d"/>
    <circle cx="16" cy="14" r="4" fill="#484f58"/><circle cx="30" cy="14" r="4" fill="#484f58"/><circle cx="44" cy="14" r="4" fill="#484f58"/>
    <g transform="translate(90 94)">
      <circle r="44" fill="none" stroke="#21262d"/>
      <circle r="30" fill="none" stroke="#21262d"/>
      <circle r="16" fill="none" stroke="#21262d"/>
      <circle r="7" fill="#f0f6fc"/>
      <circle cx="30" cy="-2" r="4" fill="#58a6ff"/>
      <circle cx="-12" cy="-10" r="3" fill="#79c0ff"/>
      <circle cx="-38" cy="22" r="4" fill="#3fb950"/>
      <circle cx="10" cy="42" r="3" fill="#a5d6ff"/>
    </g>
  </g>
  <text x="1138" y="318" class="mono" font-size="11" fill="#8b949e" text-anchor="middle">1 browser, 1 page at a time</text>
</svg>
